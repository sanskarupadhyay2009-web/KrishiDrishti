name: krishidrishti
description: "KrishiDrishti - AI Powered Smart Farming Assistant"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.1
  flutter_blue_plus: ^1.36.8
  google_generative_ai: ^0.2.2
  http: ^1.2.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  image_picker: ^1.0.7
  flutter_dotenv: ^5.1.0
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  permission_handler: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
