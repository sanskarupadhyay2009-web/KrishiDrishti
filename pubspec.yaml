name: krishidrishti
description: "KrishiDrishti - AI Powered Smart Farming Assistant"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Fonts
  google_fonts: ^6.3.2

  # App-wide state (language, device, history)
  provider: ^6.1.5

  # Local persistence (language choice + scan history)
  shared_preferences: ^2.5.3

  # Charts for scan history trend
  fl_chart: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
